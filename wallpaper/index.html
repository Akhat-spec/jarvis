<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>JARVIS Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #030a12; cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* интерфейс Джарвиса поверх анимации, пока Джарвис запущен */
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0;
         transition: opacity 1.2s ease; pointer-events: none; background: #030a12; }
  #hud.on { opacity: 1; pointer-events: auto; }  /* клики с рабочего стола пересылает wallpaper.py */
</style>
</head>
<body>
<script src="we_config.js"></script><!-- ключ для ядра: только в проекте Wallpaper Engine -->
<canvas id="c"></canvas>
<iframe id="hud" title="J.A.R.V.I.S" allow="fullscreen"></iframe>
<script>
"use strict";
// ── Живые обои J.A.R.V.I.S. ── цвет и движение следуют за состоянием Джарвиса (если он запущен)
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const FONT = "Bahnschrift, 'Segoe UI', sans-serif";

const COLORS = {
  listening: [79, 216, 255], thinking: [255, 179, 71], speaking: [150, 238, 255],
  agent: [196, 139, 255], idle: [90, 150, 185], offline: [79, 200, 245],
};
const SPIN = { listening: 1, thinking: 3.2, speaking: 1.6, agent: 3.6, idle: 0.35, offline: 0.8 };
// подпись над часами — только когда Джарвис чем-то занят
const LABEL = { thinking: "АНАЛИЗ", speaking: "ГОЛОСОВОЙ ВЫВОД", agent: "АГЕНТ АКТИВЕН" };
const DAYS = ["ВОСКРЕСЕНЬЕ", "ПОНЕДЕЛЬНИК", "ВТОРНИК", "СРЕДА", "ЧЕТВЕРГ", "ПЯТНИЦА", "СУББОТА"];
const MONTHS = ["ЯНВАРЯ", "ФЕВРАЛЯ", "МАРТА", "АПРЕЛЯ", "МАЯ", "ИЮНЯ", "ИЮЛЯ", "АВГУСТА", "СЕНТЯБРЯ",
                "ОКТЯБРЯ", "НОЯБРЯ", "ДЕКАБРЯ"];

let W = 0, H = 0, DPR = 1, bgLayer = null, glowSprite = null, particles = [];
let state = "offline", col = COLORS.offline.slice(), spin = 1, pulse = 0.3;
let rot = { a: 0, b: 0, c: 0, d: 0, sweep: 0 };
let covered = false, lastFrame = 0, last = performance.now();

const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const lighten = (c, t) => c.map((v) => v + (255 - v) * t);

// ── статичные слои: фон, сетка, виньетка (перерисовываются только при смене размера) ──
function buildBackground() {
  bgLayer = document.createElement("canvas");
  bgLayer.width = W * DPR; bgLayer.height = H * DPR;
  const g = bgLayer.getContext("2d");
  g.scale(DPR, DPR);
  const rg = g.createRadialGradient(W * 0.5, H * 0.48, 0, W * 0.5, H * 0.48, Math.hypot(W, H) * 0.6);
  rg.addColorStop(0, "#0a2033"); rg.addColorStop(0.45, "#061423"); rg.addColorStop(1, "#02070d");
  g.fillStyle = rg; g.fillRect(0, 0, W, H);

  // шестиугольная сетка
  // шестиугольники с плоским верхом: шаг по x — 1.5s, по y — √3·s, нечётные столбцы сдвинуты на полшага
  const s = Math.max(26, Math.min(W, H) / 30), vh = Math.sqrt(3) * s;
  g.strokeStyle = "rgba(90,180,230,0.05)"; g.lineWidth = 1;
  g.beginPath();
  for (let col = 0, x = 0; x < W + s * 2; col++, x = col * 1.5 * s) {
    for (let y = (col % 2) * vh / 2; y < H + vh; y += vh) {
      for (let k = 0; k <= 6; k++) {
        const a = (Math.PI / 3) * k, px = x + s * Math.cos(a), py = y + s * Math.sin(a);
        k ? g.lineTo(px, py) : g.moveTo(px, py);
      }
    }
  }
  g.stroke();
  // виньетка
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.65)");
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

  // мягкое свечение (спрайт), перекрашивается через globalCompositeOperation
  glowSprite = document.createElement("canvas");
  glowSprite.width = glowSprite.height = 256;
  const s2 = glowSprite.getContext("2d");
  const gg = s2.createRadialGradient(128, 128, 0, 128, 128, 128);
  gg.addColorStop(0, "rgba(255,255,255,1)"); gg.addColorStop(0.25, "rgba(255,255,255,0.45)");
  gg.addColorStop(0.6, "rgba(255,255,255,0.08)"); gg.addColorStop(1, "rgba(255,255,255,0)");
  s2.fillStyle = gg; s2.fillRect(0, 0, 256, 256);
}

function initParticles() {
  const n = Math.round((W * H) / 26000);
  particles = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 9, vy: (Math.random() - 0.5) * 9,
    r: Math.random() * 1.4 + 0.4, tw: Math.random() * Math.PI * 2,
  }));
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBackground(); initParticles();
}
window.addEventListener("resize", resize);

// ── рисование ──
function glow(x, y, r, c, a) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = a;
  ctx.drawImage(tinted(c), x - r, y - r, r * 2, r * 2);
  ctx.restore();
}
const tintCache = { key: "", canvas: null };
function tinted(c) {
  const key = c.map((v) => v | 0).join(",");
  if (tintCache.key === key) return tintCache.canvas;
  const t = tintCache.canvas || document.createElement("canvas");
  t.width = t.height = 256;
  const g = t.getContext("2d");
  g.clearRect(0, 0, 256, 256);
  g.drawImage(glowSprite, 0, 0);
  g.globalCompositeOperation = "source-in";
  g.fillStyle = rgba(c, 1); g.fillRect(0, 0, 256, 256);
  g.globalCompositeOperation = "source-over";
  tintCache.key = key; tintCache.canvas = t;
  return t;
}

function ring(cx, cy, r, w, c, a, dash) {
  ctx.beginPath();
  ctx.setLineDash(dash || []);
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = rgba(c, a); ctx.lineWidth = w; ctx.stroke();
  ctx.setLineDash([]);
}

function arcSeg(cx, cy, r, a0, a1, w, c, a) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, a0, a1);
  ctx.strokeStyle = rgba(c, a); ctx.lineWidth = w; ctx.stroke();
}

function ticks(cx, cy, r, n, len, rotA, c, a) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const ang = rotA + (i / n) * Math.PI * 2;
    const l = i % 15 === 0 ? len * 2.2 : i % 5 === 0 ? len * 1.4 : len;
    const cs = Math.cos(ang), sn = Math.sin(ang);
    ctx.moveTo(cx + cs * r, cy + sn * r);
    ctx.lineTo(cx + cs * (r - l), cy + sn * (r - l));
  }
  ctx.strokeStyle = rgba(c, a); ctx.lineWidth = 1; ctx.stroke();
}

// Где запущены обои: в Wallpaper Engine (страница открыта как локальный файл) или через wallpaper.py
// (свой сервер с /covered, /insets, /events). В Wallpaper Engine паузу, мышь и колесо он делает сам.
const WE = location.protocol === "file:";

// видимая область без панели задач (CSS-пиксели), обновляется из /insets
let INS = { left: 0, top: 0, right: 0, bottom: 0 };
function screenInsets() {  // Wallpaper Engine: рабочая область экрана из window.screen
  const s = window.screen;
  const left = Math.max(0, s.availLeft || 0), top = Math.max(0, s.availTop || 0);
  return { left, top, right: Math.max(0, s.width - s.availWidth - left), bottom: Math.max(0, s.height - s.availHeight - top) };
}
async function loadInsets() {
  if (WE) { INS = screenInsets(); return; }
  try {
    const r = await (await fetch("/insets", { cache: "no-store" })).json(), d = window.devicePixelRatio || 1;
    INS = { left: r.left / d, top: r.top / d, right: r.right / d, bottom: r.bottom / d };
  } catch {}
}
const area = () => ({ x: INS.left, y: INS.top, w: W - INS.left - INS.right, h: H - INS.top - INS.bottom });

function drawReactor(t) {
  const A = area();
  const cx = A.x + A.w * 0.5, cy = A.y + A.h * 0.48, R = Math.min(A.w, A.h) * 0.3;
  const p = pulse, c = col, bright = lighten(c, 0.45);

  glow(cx, cy, R * 1.9, c, 0.10 + 0.08 * p);

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  // внешние скобы
  ring(cx, cy, R * 1.17, 1, c, 0.12);
  for (let k = 0; k < 4; k++) {
    const a0 = rot.d + k * Math.PI / 2;
    arcSeg(cx, cy, R * 1.17, a0, a0 + 0.42, 3, c, 0.55);
    arcSeg(cx, cy, R * 1.21, a0 + 0.1, a0 + 0.22, 1.5, c, 0.4);
  }

  // шкала
  ticks(cx, cy, R * 1.06, 180, R * 0.018, rot.a, c, 0.35);
  ring(cx, cy, R * 1.065, 1, c, 0.18);

  // «индикаторы загрузки» — дуги, которые плавно растут и сжимаются
  for (let k = 0; k < 3; k++) {
    const base = -Math.PI / 2 + k * (Math.PI * 2 / 3) + rot.c * 0.3;
    const len = 0.35 + 0.3 * (0.5 + 0.5 * Math.sin(t * 0.6 + k * 2.1));
    arcSeg(cx, cy, R * 0.97, base, base + len, R * 0.022, c, 0.55 + 0.25 * p);
  }

  // сегментированное кольцо (две проходки: широкая тусклая — свечение, узкая яркая)
  const segN = 24, segR = R * 0.86;
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    for (let i = 0; i < segN; i++) {
      const a0 = rot.b + (i / segN) * Math.PI * 2;
      ctx.moveTo(cx + Math.cos(a0) * segR, cy + Math.sin(a0) * segR);
      ctx.arc(cx, cy, segR, a0, a0 + (Math.PI * 2 / segN) * 0.62);
    }
    ctx.strokeStyle = rgba(c, pass ? 0.75 + 0.2 * p : 0.12);
    ctx.lineWidth = pass ? R * 0.05 : R * 0.09;
    ctx.stroke();
  }

  // пунктир против часовой
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-rot.a * 1.7); ctx.translate(-cx, -cy);
  ring(cx, cy, R * 0.74, 2, c, 0.45, [R * 0.012, R * 0.03]);
  ctx.restore();

  // радар
  ctx.save();
  const cg = ctx.createConicGradient(rot.sweep, cx, cy);
  cg.addColorStop(0, rgba(c, 0.32)); cg.addColorStop(0.12, rgba(c, 0.0)); cg.addColorStop(1, rgba(c, 0.0));
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.7, 0, Math.PI * 2); ctx.arc(cx, cy, R * 0.47, 0, Math.PI * 2, true);
  ctx.fillStyle = cg; ctx.fill();
  ctx.restore();
  ring(cx, cy, R * 0.7, 1, c, 0.25);

  // внутреннее кольцо с засечками
  ring(cx, cy, R * 0.47, 2.5, bright, 0.7);
  ring(cx, cy, R * 0.44, 1, c, 0.3);
  for (let k = 0; k < 6; k++) {
    const a0 = -rot.c + k * Math.PI / 3;
    arcSeg(cx, cy, R * 0.505, a0, a0 + 0.18, 3, bright, 0.6);
  }

  // ядро
  glow(cx, cy, R * (0.55 + 0.12 * p), c, 0.35 + 0.35 * p);
  ctx.restore();

  // часы и дата в центре
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0"), mm = String(now.getMinutes()).padStart(2, "0");
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(235,250,255,0.95)";
  ctx.font = `300 ${R * 0.24}px ${FONT}`;
  ctx.shadowColor = rgba(c, 0.8); ctx.shadowBlur = 18;
  ctx.fillText(`${hh}:${mm}`, cx, cy - R * 0.02);
  ctx.shadowBlur = 0;
  ctx.font = `400 ${R * 0.05}px ${FONT}`;
  ctx.fillStyle = rgba(bright, 0.8);
  ctx.fillText(`${DAYS[now.getDay()]} · ${now.getDate()} ${MONTHS[now.getMonth()]}`, cx, cy + R * 0.17);
  ctx.font = `600 ${R * 0.04}px ${FONT}`;
  ctx.fillStyle = rgba(c, 0.65);
  ctx.fillText(spaced(LABEL[state] || ""), cx, cy - R * 0.2);
  ctx.fillText(spaced("J.A.R.V.I.S."), cx, cy + R * 1.33);
}

function spaced(s) { return s.split("").join(" "); }

function drawParticles(dt, t) {
  const c = col, maxD = Math.min(W, H) * 0.09, maxD2 = maxD * maxD;
  for (const q of particles) {
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.x < -10) q.x = W + 10; else if (q.x > W + 10) q.x = -10;
    if (q.y < -10) q.y = H + 10; else if (q.y > H + 10) q.y = -10;
  }
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 1;
  for (let i = 0; i < particles.length; i++) {
    const a = particles[i];
    for (let j = i + 1; j < particles.length; j++) {
      const b = particles[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
      if (d2 < maxD2) {
        ctx.strokeStyle = rgba(c, 0.10 * (1 - d2 / maxD2));
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }
  for (const q of particles) {
    ctx.fillStyle = rgba(lighten(c, 0.3), 0.35 + 0.35 * Math.sin(t * 1.5 + q.tw));
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawFrame(t) {
  // уголки HUD
  const A = area(), c = col, m = Math.min(A.w, A.h) * 0.035, L = Math.min(A.w, A.h) * 0.08;
  const x0 = A.x + m, y0 = A.y + m, x1 = A.x + A.w - m, y1 = A.y + A.h - m;
  ctx.strokeStyle = rgba(c, 0.35); ctx.lineWidth = 1.5;
  for (const [x, y, sx, sy] of [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  }
  // сканирующая полоса
  const y = ((t * 0.04) % 1.2 - 0.1) * H;
  const g = ctx.createLinearGradient(0, y - 60, 0, y + 60);
  g.addColorStop(0, rgba(c, 0)); g.addColorStop(0.5, rgba(c, 0.05)); g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g; ctx.fillRect(0, y - 60, W, 120);
}

// Когда анимацию не видно (стол закрыт окнами или поверх неё интерфейс Джарвиса), не рисуем и не
// держим requestAnimationFrame: даже пустой цикл кадров заставляет браузер собирать кадр 60 раз в
// секунду (~9% ядра). Вместо этого раз в полсекунды проверяем, не пора ли снова рисовать.
const hiddenNow = () => covered || hudCovers();
function schedule() {
  if (hiddenNow()) setTimeout(() => schedule(), 500);
  else requestAnimationFrame(tick);
}
function tick(now) {
  if (hiddenNow()) { last = now; schedule(); return; }
  requestAnimationFrame(tick);
  if (now - lastFrame < 1000 / 30 - 2) return;  // 30 кадров/с
  lastFrame = now;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t = now / 1000;

  const k = 1 - Math.exp(-dt * 4);
  const target = COLORS[state] || COLORS.offline;
  col = col.map((v, i) => v + (target[i] - v) * k);
  spin += ((SPIN[state] || 1) - spin) * k;
  const want = state === "speaking" ? 0.55 + 0.45 * (0.6 * Math.sin(t * 9) + 0.4 * Math.sin(t * 13.7 + 1.3))
             : state === "idle" ? 0.15 : 0.45 + 0.35 * Math.sin(t * 1.6);
  pulse += (want - pulse) * (1 - Math.exp(-dt * 8));
  rot.a += dt * 0.05 * spin; rot.b += dt * 0.25 * spin; rot.c += dt * 0.4 * spin;
  rot.d -= dt * 0.08 * spin; rot.sweep += dt * 1.2 * spin;

  ctx.drawImage(bgLayer, 0, 0, W, H);
  drawParticles(dt, t);
  drawFrame(t);
  drawReactor(t);
}

// ── интерфейс Джарвиса на обоях: показываем, пока ядро на связи ──
const hud = document.getElementById("hud");
let hudOn = false, hudOffTimer = null;
// интерфейс не должен уходить под панель задач: передаём ему отступы в CSS-пикселях
async function hudSrc() {
  const q = new URLSearchParams({ wallpaper: "" });
  if (WE) {
    // Wallpaper Engine не показывает в рамке страницы с http://127.0.0.1 — берём локальную копию
    // интерфейса из проекта обоев (её обновляет run.py) и передаём ключ для подключения к ядру
    const ins = screenInsets();
    for (const k of ["left", "top", "right", "bottom"]) q.set(k, Math.round(ins[k]));
    q.set("token", (window.JARVIS_WE && window.JARVIS_WE.token) || "");
    return "hud/index.html?" + q.toString();
  } else {
    try {
      const ins = await (await fetch("/insets", { cache: "no-store" })).json();
      const dpr = window.devicePixelRatio || 1;
      for (const k of ["left", "top", "right", "bottom"]) q.set(k, Math.round(ins[k] / dpr));
    } catch {}
  }
  return "http://127.0.0.1:8765/?" + q.toString();
}

function showHud() {
  clearTimeout(hudOffTimer);
  hudOffTimer = null;
  if (hudOn) return;
  hudOn = true;
  // показываем только загруженный интерфейс (пустая страница после скрытия тоже вызывает onload)
  hud.onload = () => { if (hudOn && hud.getAttribute("src")) hud.classList.add("on"); };
  hudSrc().then((src) => { if (hudOn) hud.src = src; });
}
function hideHudSoon() {  // короткий обрыв (перезапуск ядра) не должен мигать обоями
  // повторные неудачные подключения не должны откладывать отсчёт заново
  if (!hudOn || hudOffTimer) return;
  hudOffTimer = setTimeout(() => {
    hudOffTimer = null;
    hudOn = false;
    hud.classList.remove("on");
    setTimeout(() => { if (!hudOn) hud.removeAttribute("src"); }, 1300);
  }, 4000);
}
const hudCovers = () => hudOn && hud.classList.contains("on") && hud.style.display !== "none";

// ── связь с Джарвисом (только чтение состояния) ──
function connect() {
  let ws;
  try { ws = new WebSocket("ws://127.0.0.1:8766"); } catch { return setTimeout(connect, 3000); }
  ws.onmessage = (e) => {
    try {
      const m = JSON.parse(e.data);
      if (m.type === "status") {
        state = m.agent ? "agent" : (COLORS[m.state] ? m.state : "listening");
        showHud();
      }
    } catch {}
  };
  ws.onclose = () => { state = "offline"; hideHudSoon(); setTimeout(connect, 3000); };
}

// закрыт ли рабочий стол развёрнутым окном (сообщает wallpaper.py) — тогда экономим
async function pollCovered() {
  try { covered = (await (await fetch("/covered", { cache: "no-store" })).json()).covered; } catch {}
  // скрытый (display:none) интерфейс браузер не перерисовывает — экономим, пока стол закрыт окнами
  const disp = covered ? "none" : "";
  if (hud.style.display !== disp) hud.style.display = disp;
  setTimeout(pollCovered, 1000);
}

// Wallpaper Engine: ядро не пустит WebSocket со страницы-файла (Origin: null — так и задумано для
// защиты), поэтому здесь только проверяем, отвечает ли сервер интерфейса, и показываем его в рамке.
// Сам интерфейс в рамке подключается к ядру со своего адреса 127.0.0.1:8765 — как обычно.
async function pollCore() {
  try {
    await fetch("http://127.0.0.1:8765/style.css", { mode: "no-cors", cache: "no-store" });
    state = "listening";
    showHud();
  } catch {
    state = "offline";
    hideHudSoon();
  }
  setTimeout(pollCore, 3000);
}

resize();
if (location.protocol.startsWith("http") || WE) { loadInsets(); setInterval(loadInsets, 10000); }

// колесо мыши с рабочего стола (wallpaper.py → /events) — передаём интерфейсу в рамке
if (window.EventSource && location.protocol.startsWith("http")) {
  const es = new EventSource("/events");
  es.onmessage = (e) => {
    if (hudOn && hud.contentWindow) hud.contentWindow.postMessage(JSON.parse(e.data), "http://127.0.0.1:8765");
  };
}
